[package]
name = "rustle-core"
description = "UI-agnostic mail logic for Rustle: models, storage, IMAP/SMTP, MIME"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Built for a phone shell (rustle's `phone` feature): Online Accounts are the
# phone's own settings' (goa_setup.rs).
phone = []

[dependencies]
log.workspace = true
thiserror.workspace = true
# Private files for gpg to verify a detached signature against (pgp.rs).
tempfile = "3"
chrono.workspace = true
regex.workspace = true
gio.workspace = true
glib.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
imap = "3.0.0-alpha.15"
imap-proto = "0.16"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname", "pool"] }
native-tls = "0.2"
mail-parser = "0.11"
base64 = "0.22"
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# The keyring: the Secret Service on the desktop, the Secret portal inside a
# sandbox (Flatpak, omarchy-mobile), on async-io as the rest of the I/O.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
html-escape = "0.2"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
gethostname = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
