[package]
name = "rustle"
description = "A GTK 4 / libadwaita email client"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
rustle-core = { path = "../rustle-core" }
log.workspace = true
chrono.workspace = true
gio.workspace = true
glib.workspace = true
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
webkit = { package = "webkit6", version = "0.6", features = ["v2_48"] }
javascriptcore = { package = "javascriptcore6", version = "0.6" }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
url = "2"
# The built-in graphmail-bridge (src/bridge.rs), behind the `graph` feature.
graphmail-bridge = { git = "https://github.com/turbineBMW/graphmail-bridge", branch = "feat/embed", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"], optional = true }
anyhow = { version = "1", optional = true }
# The bridge reports through tracing; with no subscriber, "log" passes it on
# to Rustle's own logger.
tracing = { version = "0.1", features = ["log"], optional = true }

[features]
default = ["graph"]
# Microsoft 365 through a built-in graphmail-bridge: for tenants that block
# other mail apps, or GNOME Online Accounts' own (src/bridge.rs).
graph = ["dep:graphmail-bridge", "dep:tokio", "dep:anyhow", "dep:tracing"]
# The phone layout (src/window/phone.rs): one page at a time, nothing to press
# at the top, the controls floating at the bottom, the app menu and back for a
# phone shell such as omarchy-mobile's.
phone = ["rustle-core/phone"]

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"
