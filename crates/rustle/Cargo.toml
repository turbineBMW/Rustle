[package]
name = "rustle"
description = "A GTK 4 / libadwaita email client"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "rustle"
path = "src/main.rs"

[dependencies]
rustle-core = { path = "../rustle-core" }
log.workspace = true
chrono.workspace = true
gio.workspace = true
glib.workspace = true
env_logger = "0.11"
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
webkit = { package = "webkit6", version = "0.6", features = ["v2_48"] }
javascriptcore = { package = "javascriptcore6", version = "0.6" }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
url = "2"

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"
